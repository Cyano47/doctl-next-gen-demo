# Full App Platform spec for doctl deploy.
# Replace GITHUB_OWNER and GITHUB_REPO with your repo (e.g. myuser/do-console-ui).
# Usage: REPO=owner/repo BRANCH=main ./scripts/deploy-do.sh

name: do-console-ui
region: nyc

services:
  - name: web
    environment_slug: node-js
    github:
      repo: GITHUB_OWNER/GITHUB_REPO
      branch: main
      deploy_on_push: true
    build_command: npm ci && npm run build
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
